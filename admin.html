<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portfolio Admin</title><link rel="stylesheet" href="app.css"></head><body class="adminBody"><main class="loginView" id="login"><form class="loginCard" id="loginForm"><div class="brand"><span class="logo">PA</span><span>Portfolio Admin<small>SUPABASE CMS</small></span></div><h1 style="font-size:32px">เข้าสู่ระบบ</h1><div class="notice" id="configNotice">ต้องตั้งค่า <code>config.js</code> และรัน <code>schema.sql</code> ก่อน</div><label>อีเมล<input name="email" type="email" required></label><label>รหัสผ่าน<input name="password" type="password" required></label><button class="button primary">เข้าสู่ระบบ</button><p id="loginStatus"></p></form></main><main class="adminShell hidden" id="dashboard"><aside class="sidebar"><a class="brand" href="index.html"><span class="logo">PA</span><span>Portfolio Admin<small>4-YEAR CMS</small></span></a><div class="sideNav" id="sideNav"><button class="active" data-panel="overview">ภาพรวม</button><button data-panel="profile">ข้อมูลส่วนตัว</button><button data-panel="projects">ผลงาน 4 ปี</button><button data-panel="skills">ทักษะ</button><button data-panel="messages">ข้อความ</button><button data-panel="media">คลังไฟล์</button></div></aside><section class="adminMain"><div class="adminTop"><div><span class="eyebrow">Administrator</span><h2>ระบบจัดการ Portfolio</h2></div><div class="actions"><a class="button" href="index.html" target="_blank">ดูเว็บไซต์</a><button class="button danger" id="logout">ออกจากระบบ</button></div></div><p id="globalStatus"></p><div class="panel active" id="panel-overview"><div class="projectGrid" id="stats"></div></div><div class="panel" id="panel-profile"><form class="card formGrid" id="profileForm"></form></div><div class="panel" id="panel-projects"><div class="adminTop"><h3>ผลงานและประสบการณ์</h3><button class="button primary" id="addProject">＋ เพิ่มผลงาน</button></div><div id="projectsTable"></div></div><div class="panel" id="panel-skills"><div class="adminTop"><h3>ทักษะ</h3><button class="button primary" id="addSkill">＋ เพิ่มทักษะ</button></div><div id="skillsTable"></div></div><div class="panel" id="panel-messages"><div id="messagesTable"></div></div><div class="panel" id="panel-media"><form class="card" id="uploadForm"><h3>อัปโหลดไฟล์</h3><p>JPG, PNG, WebP, PDF, MP4 สูงสุด 10 MB</p><input type="file" id="file" required><button class="button primary">อัปโหลด</button><p id="uploadStatus"></p></form></div></section></main><div class="modal" id="modal"><div class="dialog"><div class="dialogTop"><h2 id="modalTitle">แก้ไขข้อมูล</h2><button class="button" id="close">×</button></div><form class="formGrid" id="modalForm"></form></div></div><script type="module" src="admin.js"></script></body></html>
